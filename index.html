<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Michidash: Flight Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #050811;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 8px;
            font-size: 20px;
            letter-spacing: 3px;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            text-transform: uppercase;
        }
        #game-wrapper {
            position: relative;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.25);
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #38bdf8;
        }
        canvas {
            display: block;
            background-color: #0b0f19;
            touch-action: none;
        }
        p {
            margin-top: 10px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>MICHIDASH: FLIGHT EDITION</h1>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>
    <p><b>Chạy dưới đất</b> & <b>Bấm liên tục SPACE / Chạm màn hình</b> để Bay lên!</p>

    <script>
        (function() {
            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");

            // Nhân vật khối đá hoa văn
            let player = {
                x: 60,
                y: 500, // Khởi tạo ở dưới đất
                size: 32,
                gravity: 0.45,       // Trọng lực kéo xuống
                lift: -6.5,          // Lực đẩy khi bấm bay lên
                velocity: 0,         // Vận tốc dọc
                angle: 0,
                isOnGround: false
            };

            let obstacles = [];
            let particles = [];
            let frameCount = 0;
            let score = 0;
            let gameOver = false;

            function handleAction() {
                if (gameOver) {
                    resetGame();
                } else {
                    // Bấm nhiều lần để bay lên
                    player.velocity = player.lift;

                    // Hiệu ứng hạt bụi khi bay/nhảy
                    for (let i = 0; i < 4; i++) {
                        particles.push({
                            x: player.x + player.size / 2,
                            y: player.y + player.size,
                            vx: (Math.random() - 0.5) * 3,
                            vy: Math.random() * 2 + 1,
                            radius: Math.random() * 2 + 1,
                            alpha: 1
                        });
                    }
                }
            }

            window.addEventListener("keydown", function(e) {
                if (e.code === "Space" || e.code === "ArrowUp") {
                    e.preventDefault();
                    handleAction();
                }
            });

            canvas.addEventListener("pointerdown", function(e) {
                e.preventDefault();
                handleAction();
            });

            function resetGame() {
                player.y = 500;
                player.velocity = 0;
                player.angle = 0;
                player.isOnGround = false;
                obstacles = [];
                particles = [];
                score = 0;
                frameCount = 0;
                gameOver = false;
                requestAnimationFrame(gameLoop);
            }

                player.y += player.velocity;
