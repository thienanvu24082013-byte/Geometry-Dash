<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Michidash: Neon Dash</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #050811;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 8px;
            font-size: 22px;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ff0055, #ffae00, #00ffcc, #0088ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 900;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }
        #game-wrapper {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.25);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #00ffcc;
        }
        canvas {
            display: block;
            background-color: #0b0f19;
            touch-action: none;
        }
        p {
            margin-top: 10px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Michidash: Neon Dash</h1>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>
    <p><b>Chạy dưới đất</b> & <b>Bấm liên tục SPACE / Chạm màn hình</b> để Bay lên!</p>

    <script>
        (function() {
            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");

            // Nhân vật khối đá hoa văn
            let player = {
                x: 60,
                y: 500,
                size: 32,
                gravity: 0.45,
                lift: -6.5,
                velocity: 0,
                angle: 0,
                isOnGround: false
            };

            let obstacles = [];
            let particles = [];
            let trailHistory = []; // Lưu vị trí tạo vệt sáng cầu vồng phía sau
            let frameCount = 0;
            let score = 0;
            let gameOver = false;

            function handleAction() {
                if (gameOver) {
                    resetGame();
                } else {
                    player.velocity = player.lift;

                    // Hiệu ứng hạt bụi
                    for (let i = 0; i < 4; i++) {
                        particles.push({
                            x: player.x + player.size / 2,
                            y: player.y + player.size,
                            vx: (Math.random() - 0.5) * 3,
                            vy: Math.random() * 2 + 1,
                            radius: Math.random() * 2 + 1,
                            alpha: 1
                        });
                    }
                }
            }

            window.addEventListener("keydown", function(e) {
                if (e.code === "Space" || e.code === "ArrowUp") {
                    e.preventDefault();
                    handleAction();
                }
            });

            canvas.addEventListener("pointerdown", function(e) {
                e.preventDefault();
                handleAction();
            });

            function resetGame() {
                player.y = 500;
                player.velocity = 0;
                player.angle = 0;
                player.isOnGround = false;
                obstacles = [];
                particles = [];
                trailHistory = [];
                score = 0;
                frameCount = 0;
                gameOver = false;
                requestAnimationFrame(gameLoop);
            }

            function update() {
                if (gameOver) return;

                player.velocity += player.gravity;
                player.y += player.velocity;
                player.angle += player.velocity * 0.03;

                // Lưu lại vị trí để làm vệt sáng cầu vồng (Rainbow Trail)
                trailHistory.push({
                    x: player.x + player.size / 2,
                    y: player.y + player.size / 2
                });
                if (trailHistory.length > 15) {
                    trailHistory.shift(); // Giới hạn độ dài vệt sáng
                }

                // Chạm sàn
                if (player.y + player.size >= canvas.height) {
                    player.y = canvas.height - player.size;
                    player.velocity = 0;
                    player.isOnGround = true;
                } else {
                    player.isOnGround = false;
                }

                // Chạm trần
                if (player.y <= 0) {
                    player.y = 0;
                    player.velocity = 0;
                }

                // Sinh chướng ngại vật định kỳ
                frameCount++;
                if (frameCount % 100 === 0) {
                    let typeRand = Math.random();
                    if (typeRand < 0.4) {
                        let gap = 150;
                        let topH = Math.floor(Math.random() * (canvas.height - gap - 120)) + 40;
                        obstacles.push({
                            x: canvas.width,
                            width: 44,
                            top: topH,
                            bottom: canvas.height - topH - gap,
                            type: 'pillar',
                            passed: false
                        });
                    } else if (typeRand < 0.7) {
                        obstacles.push({
                            x: canvas.width,
                            width: 36,
                            height: 35,
                            type: 'floorSpike',
                            passed: false
                        });
                    } else {
                        let blockY = Math.floor(Math.random() * 250) + 150;
                        obstacles.push({
                            x: canvas.width,
                            y: blockY,
                            width: 60,
                            height: 28,
                            type: 'platform',
                            passed: false
                        });
                    }
                }

                // Cập nhật chướng ngại vật & kiểm tra va chạm
                for (let i = 0; i < obstacles.length; i++) {
                    let obs = obstacles[i];
                    obs.x -= 3.2;

                    if (player.x < obs.x + obs.width && player.x + player.size > obs.x) {
                        if (obs.type === 'pillar') {
                            if (player.y < obs.top || player.y + player.size > canvas.height - obs.bottom) {
                                gameOver = true;
                            }
                        } else if (obs.type === 'floorSpike') {
                            if (player.y + player.size > canvas.height - obs.height) {
                                gameOver = true;
                            }
                        } else if (obs.type === 'platform') {
                            if (
                                player.y + player.size > obs.y &&
                                player.y < obs.y + obs.height &&
                                player.x + player.size > obs.x &&
                                player.x < obs.x + obs.width
                            ) {
                                gameOver = true;
                            }
                        }
                    }

                    if (obs.x + obs.width < player.x && !obs.passed) {
                        score++;
                        obs.passed = true;
                    }
                }

                obstacles = obstacles.filter(obs => obs.x + obs.width > 0);

                for (let p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.04;
                }
                particles = particles.filter(p => p.alpha > 0);
            }

            function draw() {
                ctx.fillStyle = "#0b0f19";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Vẽ mặt đất
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(0, canvas.height - 10, canvas.width, 10);
                ctx.strokeStyle = "#00ffcc";
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, canvas.height - 10); ctx.lineTo(canvas.width, canvas.height - 10); ctx.stroke();

                // Lưới nền mờ
                ctx.strokeStyle = "rgba(0, 255, 204, 0.03)";
                ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += 35) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }

                // Vẽ vệt sáng cầu vồng (Rainbow Trail) phía sau nhân vật
                for (let i = 0; i < trailHistory.length; i++) {
                    let point = trailHistory[i];
                    let ratio = i / trailHistory.length; // Độ mờ dần về đuôi
                    let hue = (i * 20 + frameCount * 5) % 360; // Hiệu ứng đổi màu cầu vồng

                    ctx.save();
                    ctx.fillStyle = `hsla(${hue}, 100%, 50%, ${ratio * 0.6})`;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, player.size * 0.4 * ratio, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Vẽ hạt bụi
                for (let p of particles) {
                    ctx.fillStyle = `rgba(0, 255, 204, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Vẽ chướng ngại vật
                for (let obs of obstacles) {
                    if (obs.type === 'pillar') {
                        ctx.fillStyle = "#1e293b";
                        ctx.fillRect(obs.x, 0, obs.width, obs.top);
                        ctx.fillRect(obs.x, canvas.height - obs.bottom, obs.width, obs.bottom);

                        ctx.strokeStyle = "#00ffcc";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(obs.x, 0, obs.width, obs.top);
                        ctx.strokeRect(obs.x, canvas.height - obs.bottom, obs.width, obs.bottom);

                        // Gai đỏ neon
                        ctx.fillStyle = "#ff0055";
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = "#ff0055";
                        
                        ctx.beginPath();
                        ctx.moveTo(obs.x, obs.top);
                        ctx.lineTo(obs.x + obs.width / 2, obs.top + 20);
                        ctx.lineTo(obs.x + obs.width, obs.top);
                        ctx.fill();

                        let bY = canvas.height - obs.bottom;
                        ctx.beginPath();
                        ctx.moveTo(obs.x, bY);
                        ctx.lineTo(obs.x + obs.width / 2, bY - 20);
                        ctx.lineTo(obs.x + obs.width, bY);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                    } else if (obs.type === 'floorSpike') {
                        ctx.fillStyle = "#ff0055";
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = "#ff0055";
                        ctx.beginPath();
                        ctx.moveTo(obs.x, canvas.height - 10);
                        ctx.lineTo(obs.x + obs.width / 2, canvas.height - 10 - obs.height);
                        ctx.lineTo(obs.x + obs.width, canvas.height - 10);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                    } else if (obs.type === 'platform') {
                        ctx.fillStyle = "#334155";
                        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                        ctx.strokeStyle = "#00ffcc";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                    }
                }

                // Vẽ nhân vật khối đá hoa văn
                ctx.save();
                ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
                ctx.rotate(player.angle);

                ctx.fillStyle = "#475569";
                ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2.5;
                ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);

                // Hoa văn bên trong
                ctx.strokeStyle = "#00ffcc";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#00ffcc";
                ctx.lineWidth = 2;
                ctx.strokeRect(-player
